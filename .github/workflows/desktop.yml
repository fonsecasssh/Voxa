# Builds the Windows installer.
#
# - Run it by hand (Actions > Desktop > Run workflow). With "Publicar" checked it creates
#   the GitHub Release v<version> (version from desktop/package.json) with the installer:
#   that's the download link for users, and installed apps auto-update from it.
#   Unchecked, it only builds the installer as a downloadable artifact.
# - Pushing a tag like v0.1.0 also publishes.
#
# The site the app opens is "voxaAppUrl" in desktop/package.json; the repository
# variable VOXA_APP_URL (Settings > Secrets and variables > Actions > Variables) overrides it.

name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar como nova versão (Release) para download e atualização automática"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w desktop
      - name: Build installer
        working-directory: desktop
        env:
          VOXA_APP_URL: ${{ vars.VOXA_APP_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'release:win' || 'dist:win' }}
      - uses: actions/upload-artifact@v4
        with:
          name: Voxa-Setup
          path: desktop/release/*.exe
