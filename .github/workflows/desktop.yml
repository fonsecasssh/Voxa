# Builds the Windows installer.
#
# - Push a tag like v0.1.0 (matching desktop/package.json "version") to publish a
#   GitHub Release; installed apps auto-update from these releases.
# - Or run it by hand (Actions > Desktop > Run workflow) to just get the installer
#   as a downloadable artifact.
#
# The site the app opens comes from the repository variable VOXA_APP_URL
# (Settings > Secrets and variables > Actions > Variables), e.g. https://voxa.app.

name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w desktop
      - name: Build installer
        working-directory: desktop
        env:
          VOXA_APP_URL: ${{ vars.VOXA_APP_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ startsWith(github.ref, 'refs/tags/v') && 'release:win' || 'dist:win' }}
      - uses: actions/upload-artifact@v4
        with:
          name: Voxa-Setup
          path: desktop/release/*.exe
