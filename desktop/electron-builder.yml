# Windows installer (NSIS) and auto-update feed (GitHub Releases).
appId: app.voxa.desktop
productName: Voxa
copyright: Copyright © Voxa
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
# Native code (global push-to-talk hook) must be a real file to load.
# It is copied into dist/ by scripts/build.mjs with its prebuilt binaries, so nothing to rebuild.
asarUnpack:
  - dist/node_modules/**
npmRebuild: false
protocols:
  - name: Voxa
    schemes: [voxa]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # A fixed name keeps the download link stable across versions:
  # https://github.com/fonsecasssh/Voxa/releases/latest/download/Voxa-Setup.exe
  artifactName: Voxa-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Voxa
publish:
  provider: github
  owner: fonsecasssh
  repo: Voxa
  releaseType: release
