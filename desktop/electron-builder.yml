# Windows installer (NSIS) and auto-update feed (GitHub Releases).
appId: app.voxa.desktop
productName: Voxa
copyright: Copyright © Voxa
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
  # The global push-to-talk hook ships its prebuilt Windows binary: keep only that one.
  - "!node_modules/uiohook-napi/{libuiohook,src,binding.gyp}"
  - "!node_modules/uiohook-napi/prebuilds/!(win32-x64)"
# Prebuilt (N-API) binaries work with Electron as they are; electron-builder unpacks
# the .node file from the asar archive by itself.
npmRebuild: false
protocols:
  - name: Voxa
    schemes: [voxa]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # A fixed name keeps the download link stable across versions:
  # https://github.com/fonsecasssh/Voxa/releases/latest/download/Voxa-Setup.exe
  artifactName: Voxa-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Voxa
publish:
  provider: github
  owner: fonsecasssh
  repo: Voxa
  releaseType: release
