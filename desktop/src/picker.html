<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Compartilhar tela</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: #1c1d24;
        color: #e6e6ec;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 16px 20px 0;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid #30313c;
      }
      .tabs button {
        background: none;
        border: none;
        color: #9a9bab;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .tabs button.active {
        color: #e6e6ec;
        border-bottom-color: #6c5ce7;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
        align-content: start;
      }
      .source {
        background: #23242c;
        border: 2px solid transparent;
        border-radius: 8px;
        padding: 8px;
        cursor: pointer;
        text-align: left;
        color: inherit;
        font: inherit;
      }
      .source:hover {
        background: #2c2d37;
      }
      .source.selected {
        border-color: #6c5ce7;
      }
      .source img.thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        background: #000;
        border-radius: 4px;
        display: block;
      }
      .source .name {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .source .name img {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .empty {
        color: #9a9bab;
        grid-column: 1 / -1;
        text-align: center;
        padding: 40px 0;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-top: 1px solid #30313c;
      }
      footer label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .spacer {
        flex: 1;
      }
      .btn {
        border: none;
        border-radius: 8px;
        padding: 9px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        color: #e6e6ec;
        background: transparent;
      }
      .btn:hover {
        background: #2c2d37;
      }
      .btn.primary {
        background: #6c5ce7;
        color: #fff;
      }
      .btn.primary:hover {
        background: #5a4bd4;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Escolha o que compartilhar</h1>
      <div class="tabs">
        <button data-kind="screen" class="active">Telas</button>
        <button data-kind="window">Janelas</button>
      </div>
    </header>
    <main id="grid"><div class="empty">Carregando…</div></main>
    <footer>
      <label id="audio-row" hidden><input type="checkbox" id="audio" checked /> Compartilhar o áudio do computador</label>
      <span class="spacer"></span>
      <button class="btn" id="cancel">Cancelar</button>
      <button class="btn primary" id="share" disabled>Compartilhar</button>
    </footer>

    <script>
      const grid = document.getElementById("grid");
      const shareBtn = document.getElementById("share");
      let data = { sources: [], audioSupported: false };
      let kind = "screen";
      let selected = null;

      function render() {
        grid.textContent = "";
        const list = data.sources.filter((s) => s.kind === kind);
        if (list.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = kind === "screen" ? "Nenhuma tela encontrada." : "Nenhuma janela aberta para compartilhar.";
          grid.append(empty);
        }
        for (const s of list) {
          const btn = document.createElement("button");
          btn.className = "source" + (s.id === selected ? " selected" : "");
          btn.title = s.name;
          const thumb = document.createElement("img");
          thumb.className = "thumb";
          thumb.src = s.thumbnail;
          thumb.alt = "";
          const name = document.createElement("div");
          name.className = "name";
          if (s.icon) {
            const icon = document.createElement("img");
            icon.src = s.icon;
            icon.alt = "";
            name.append(icon);
          }
          name.append(document.createTextNode(s.name));
          btn.append(thumb, name);
          btn.addEventListener("click", () => {
            selected = s.id;
            shareBtn.disabled = false;
            render();
          });
          btn.addEventListener("dblclick", share);
          grid.append(btn);
        }
      }

      function share() {
        if (!selected) return;
        window.picker.choose({ sourceId: selected, audio: document.getElementById("audio").checked });
      }

      document.querySelectorAll(".tabs button").forEach((b) =>
        b.addEventListener("click", () => {
          kind = b.dataset.kind;
          document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
          render();
        }),
      );
      document.getElementById("cancel").addEventListener("click", () => window.picker.choose(null));
      shareBtn.addEventListener("click", share);
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") window.picker.choose(null);
        if (e.key === "Enter") share();
      });

      window.picker.list().then((d) => {
        data = d;
        document.getElementById("audio-row").hidden = !d.audioSupported;
        // Preselect the first screen: the most common choice.
        selected = d.sources.find((s) => s.kind === "screen")?.id ?? null;
        shareBtn.disabled = !selected;
        render();
      });
    </script>
  </body>
</html>
