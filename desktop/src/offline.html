<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Voxa</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #23242c;
        color: #e6e6ec;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 22px;
        background: #6c5ce7;
        display: grid;
        place-items: center;
        font-size: 40px;
        font-weight: 900;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.55;
        }
      }
      p {
        color: #9a9bab;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="logo">V</div>
      <h2>Sem conexão com o Voxa</h2>
      <p>Verifique sua internet. Tentando reconectar…</p>
    </div>
  </body>
</html>
